name: Red Points
description: >-
  Red Points operates an AI-powered brand protection and anti-counterfeiting platform used by
  businesses to detect and remove counterfeits, unauthorized sellers, fake websites, social media
  impersonation, and digital piracy across more than 5,000 marketplaces, social networks, and app
  stores. Its software combines automated detection with enforcement and takedown workflows,
  domain monitoring, gray-market and unauthorized-seller blocking, ad-fraud detection, and
  revenue-recovery and litigation services. Red Points was surfaced as a portfolio company of
  Northzone and added to the API Evangelist network; it does not expose a public developer API or
  documented API surface as of this enrichment pass, so this profile captures the company's
  public web, legal, security, and llms.txt footprint rather than API artifacts.
